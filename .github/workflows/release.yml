# Builds the Poke-Banner Windows installer + portable .exe on a version tag
# (v1.0.0, v1.1.0, …) and attaches them to a GitHub Release, giving the
# landing page's "GET IT ON GITHUB" button a real, permanent download URL.
#
# How to publish (once this repo is on GitHub):
#   1. Push the project to a GitHub repo.
#   2. Tag the release:          git tag v1.0.0 && git push origin v1.0.0
#   3. CI builds and uploads:
#        desktop/release/Poke-Banner-Setup-1.0.0.exe      (installer)
#        desktop/release/Poke-Banner-Portable-1.0.0.exe   (portable)
#   4. The landing page auto-detects the release via a live GitHub API check
#      (useReleaseLive in src/pages/Landing.tsx) — the Download button goes
#      live the moment this release is public. No manual URL wiring needed.
name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install web app deps
        run: bun install

      - name: Build web app (dist/)
        run: bun run build

      - name: Install desktop shell deps
        working-directory: desktop
        run: bun install

      - name: Generate app icon
        working-directory: desktop
        run: bun run icon

      # Code-signing (optional): if the Azure Trusted Signing secrets are set,
      # this injects build.win.sign into desktop/package.json so electron-builder
      # signs both .exe files — killing the SmartScreen "unknown publisher"
      # warning. With no secrets it exits unchanged and the build stays unsigned
      # (see desktop/scripts/configure-azure-sign.cjs).
      - name: Configure Azure Trusted Signing (if secrets present)
        working-directory: desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
          AZURE_PROFILE_NAME: ${{ secrets.AZURE_PROFILE_NAME }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: node ./scripts/configure-azure-sign.cjs

      # electron-builder needs the Azure credentials in its own environment too.
      # (Alternative: set WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD secrets to sign
      # with a traditional .pfx certificate — picked up automatically.)
      - name: Package Windows installer + portable exe
        working-directory: desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: bunx electron-builder --win --publish never

      # Installers + the auto-update feed (latest.yml + blockmaps) so the
      # installed app can find and download the new version via electron-updater.
      # The custom body is PREPENDED to the auto-generated changelog, so every
      # release gets a readable summary plus the full commit list.
      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          generate_release_notes: true
          body: |
            ## Poke-Banner ${{ github.ref_name }}

            A 60px pixel-art Pokémon RPG that lives in your Windows taskbar.

            ### ✨ What's new in this release
            - **Auto-updates** — installed builds now self-update via differential
              blockmaps (only changed bytes download, not the whole installer)
            - **In-banner update chip** — green *UPDATE READY — RESTART* indicator
              right in the strip when a new version is downloaded
            - **NEWS tab** — in-game changelog with an installed-vs-latest diff
              banner and a differential-update explainer
            - **Portable builds** — amber *PORTABLE — MANUAL UPDATE* chip that
              opens this page (portable exes can't self-update)
            - **Localization** — full UI in 5 languages: EN / FR / DE / ES / 日本語
            - **Desktop transparency** — blue sky in the browser, transparent over
              the wallpaper in the shell
            - **Code-signing** — Azure Trusted Signing hooks in CI (when secrets
              are configured)

            ### 🖥 Downloads
            - `Poke-Banner-Setup-<version>.exe` — installer (auto-updates)
            - `Poke-Banner-Portable-<version>.exe` — portable, no install needed

            Saves are stored locally and survive updates (v1 → v2 migration).

            ---
            Full changelog:
